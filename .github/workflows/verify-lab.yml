name: 🚀 dev-lab 异构语言与多 JDK 持续集成流水线 (Polyglot Matrix CI)

on:
  push:
    branches: [ "main", "feat/*", "feature/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force_all:
        description: '是否强制开启全量回归测试 (true/false)'
        required: false
        default: 'false'

jobs:
  # =========================================================================
  # 阶段 1：增量路径过滤器 (Path Filter) —— 精准识别代码变更所属的技术栈专区
  # =========================================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      java8: ${{ steps.filter.outputs.java8 }}
      java21: ${{ steps.filter.outputs.java21 }}
      cpp20: ${{ steps.filter.outputs.cpp20 }}
    steps:
      - name: 📥 拉取代码 (获取完整 Git 历史用于 paths-filter 比对)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 路径变更检测 (按技术栈/工具链归类)
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            java8:
              - 'binary-demo/**'
              - 'tree-demo/**'
              - 'aqs-demo/**'
              - 'collection-demo/**'   
              - 'benchmark-demo/**'
              - 'benchmarks/**'
              - 'scripts/verify-jdk8-demos.sh'
            java21:
              - 'jvm-demo/**'
              - 'thread-demo/**'
              - 'innodb-demo/**'            
              - 'redis-demo/**'             
              - 'network-demo/**'            # 高性能网络编程实验
              - 'springboot-demo/**'         # SpringBoot 机制验证实验室 (Maven + JDK 21)
              - 'dubbo-demo/**'              # Dubbo 分布式 RPC 机制验证实验室 (Maven + JDK 21)
              - 'scripts/verify-jdk21-demos.sh'
              - 'scripts/verify-springboot-demos.sh'
              - 'scripts/verify-dubbo-demos.sh'
            cpp20:
              - 'virtual-memory-demo/**'
              - 'scripts/verify-cpp20-demos.sh'

  # =========================================================================
  # 阶段 2 - 专区 A: JDK 8 验证矩阵 (binary-demo / tree-demo / aqs-demo / benchmark-demo)
  # =========================================================================
  verify-jdk8:
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.detect-changes.outputs.java8 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 拉取 dev-lab 完整源码 (包含 git 历史用于 diff 比对)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ 设置 JDK 8 生产级云端验证环境
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: 🧪 智能增量公审 JDK 8 演练模块 (binary / tree / aqs / io)
        run: |
          chmod +x scripts/verify-jdk8-demos.sh
          IS_MAIN_PUSH="${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}"
          FORCE_ALL_INPUT="${{ github.event.inputs.force_all }}"
          
          if [ "$FORCE_ALL_INPUT" = "true" ] || [ "$IS_MAIN_PUSH" = "true" ]; then
            ./scripts/verify-jdk8-demos.sh true
          else
            ./scripts/verify-jdk8-demos.sh false
          fi

      - name: 🟣 编译基准镜像与执行 JMH 跑分
        working-directory: benchmarks
        run: |
          mvn -q clean package -DskipTests
          bash scripts/run-benchmarks.sh all

      - name: 📦 上传 JMH 跑分产物
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results
          path: |
            benchmarks/logs/*.log
            benchmarks/results/*.json
          if-no-files-found: warn  
  # =========================================================================
  # 阶段 2 - 专区 B: JDK 21 验证矩阵 (jvm-demo: 虚拟线程 / GC / JFR / NMT)
  # =========================================================================
  verify-jdk21:
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.detect-changes.outputs.java21 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 拉取 dev-lab 源码
        uses: actions/checkout@v4

      - name: ☕ 设置 JDK 21 现代化云端验证环境
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🚀 执行 jvm-demo 高版本 JVM 特性与诊断公审
        run: |
          chmod +x scripts/verify-jdk21-demos.sh
          ./scripts/verify-jdk21-demos.sh

  # =========================================================================
  # 阶段 2 - 专区 B2: SpringBoot 验证矩阵 (springboot-demo: Maven + JDK 21)
  # 编译 + IoC/数据层/Web 双跑法冒烟，随 java21 路径过滤器联动
  # =========================================================================
  verify-springboot:
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.detect-changes.outputs.java21 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 拉取 dev-lab 源码
        uses: actions/checkout@v4

      - name: ☕ 设置 JDK 21 + Maven 缓存
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 🍃 执行 SpringBoot 专区公审 (编译 + 冒烟 + 双跑法)
        run: |
          chmod +x scripts/verify-springboot-demos.sh
          ./scripts/verify-springboot-demos.sh

  # =========================================================================
  # 阶段 2 - 专区 B3: Dubbo 验证矩阵 (dubbo-demo: Dubbo 3.3.4 机制验证)
  # 编译 + E00 直连冒烟 + E01 序列化产物 + E09 SPI 四连，随 java21 路径过滤器联动
  # 注册中心/Nacos/ZK 类实验需 docker，CI 跳过（本地跑法见 dubbo-demo/README.md）
  # =========================================================================
  verify-dubbo:
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.detect-changes.outputs.java21 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 拉取 dev-lab 源码
        uses: actions/checkout@v4

      - name: ☕ 设置 JDK 21 + Maven 缓存
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 🌐 执行 Dubbo 专区公审 (编译 + E00/E01/E09 冒烟)
        run: |
          chmod +x scripts/verify-dubbo-demos.sh
          ./scripts/verify-dubbo-demos.sh

  # =========================================================================
  # 阶段 2 - 专区 C: C++20 验证矩阵 (virtual-memory-demo: 虚拟内存硬核验证)
  # =========================================================================
  verify-cpp20:
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.detect-changes.outputs.cpp20 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 拉取 dev-lab 源码
        uses: actions/checkout@v4

      - name: 🛠️ 检查 C++20 编译器环境 (GCC / Clang)
        run: |
          g++ --version
          make --version

      - name: 🧠 编译并公审 virtual-memory-demo 8 大硬核内存实验
        run: |
          chmod +x scripts/verify-cpp20-demos.sh
          ./scripts/verify-cpp20-demos.sh
