# MQ 机制验证实验室 - 中间件编排（仅本地实验，--rm 式生命周期：down -v 后测试数据全部销毁）
# 版本固定文章基线：Kafka 3.5.2（confluentinc/cp-kafka:7.5.2 内置，官方 apache/kafka 镜像最低 3.7）/ RabbitMQ 3.13 / Redis 7 / MySQL 8
# 注意：guest/guest 与 mqlab 口令仅为本地 lab 沙箱使用，非任何真实环境凭据
# 说明：broker 以 ZK 模式运行（CP 7.5 默认，KRaft 为 preview）；投递/确认/rebalance 机制与 KRaft 模式无差异
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.2
    container_name: mqlab-zk
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/2181; echo srvr >&3; timeout 5 cat <&3 | head -1 | grep -q Zookeeper'"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka:
    image: confluentinc/cp-kafka:7.5.2
    container_name: mqlab-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx1g -Xms1g
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 30

  mysql:
    image: mysql:8.4
    container_name: mqlab-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mqlab
      MYSQL_DATABASE: mqlab
    command: --max_connections=100
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmqlab"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: mqlab-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: mqlab-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      # 仅本地 lab：允许 guest 从容器网桥访问 management API（生产禁止）
      RABBITMQ_LOOPBACK_USERS: none
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
